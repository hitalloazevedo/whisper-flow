services:
  postgres:
    image: postgres:16-alpine
    container_name: whisper-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whisper_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d whisper_flow']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: whisper-flow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: whisper-flow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/whisper-flow-audio &&
      (mc ilm rule rm --all --force local/whisper-flow-audio || true) &&
      mc ilm rule add --expire-days 1 --prefix 'pending-uploads/' local/whisper-flow-audio
      "

  backend-migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: whisper-flow-backend-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/whisper_flow
    command: ['node', 'dist/database/run-migrations.js']

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: whisper-flow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    env_file:
      - ./apps/backend/.env
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/whisper_flow
      FRONTEND_URL: http://localhost:5173
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: whisper-flow-audio
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '3000:3000'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: whisper-flow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

  worker:
    build:
      context: ./apps/worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/whisper_flow
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: whisper-flow-audio
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      POLL_INTERVAL_SECONDS: '5'
      LOG_LEVEL: info
    volumes:
      - whisper_model_cache:/root/.cache/huggingface

volumes:
  postgres_data:
  minio_data:
  whisper_model_cache:
