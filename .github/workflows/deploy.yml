name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: false
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      namespace: ${{ steps.vars.outputs.namespace }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image vars
        id: vars
        run: |
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ steps.vars.outputs.namespace }}/whisper-flow-backend:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.namespace }}/whisper-flow-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_BASE_PATH=${{ vars.VITE_BASE_PATH }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.namespace }}/whisper-flow-frontend:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.namespace }}/whisper-flow-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: ./apps/worker
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ steps.vars.outputs.namespace }}/whisper-flow-worker:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.namespace }}/whisper-flow-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull images and restart services on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_ACTOR,GHCR_TOKEN,GHCR_NAMESPACE,IMAGE_TAG,VPS_DEPLOY_PATH
          script: |
            set -e
            cd "$VPS_DEPLOY_PATH"
            echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export GHCR_NAMESPACE IMAGE_TAG
            podman compose -f docker-compose.prod.yml pull
            podman compose -f docker-compose.prod.yml up -d --remove-orphans
            podman image prune -f
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
